<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI & You | Pinal BOOST</title>
<style>
:root{--navy:#0d2741;--gold:#e4a72b;--paper:#f7fafb;--ok:#2f7d4a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f5;font-family:Inter,Arial,sans-serif}.boostShellNav{position:fixed;left:0;right:0;top:0;height:60px;z-index:50;display:flex;align-items:center;gap:14px;padding:8px 14px;background:#0b2237;color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 5px 18px #0004}.boostShellTitle{min-width:0;flex:1}.boostShellTitle b{display:block;font-size:14px}.boostShellTitle span{display:block;margin-top:2px;font-size:11px;color:#d7e6ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.boostReturn{border:1px solid #ffffff55;border-radius:999px;background:#e4a72b;color:#10243a;padding:10px 14px;font:900 13px Inter,Arial,sans-serif;cursor:pointer;white-space:nowrap}.boostReturn:disabled{opacity:.65;cursor:wait}.boostSaveState{font-size:11px;color:#d7e6ef;min-width:90px;text-align:right}.boostFrame{position:fixed;left:0;right:0;top:60px;bottom:0;width:100%;height:calc(100% - 60px);border:0;background:#eef3f5}.loading{position:fixed;inset:60px 0 0;z-index:40;display:grid;place-items:center;background:#0d2741;color:#fff;text-align:center;padding:24px}.loading.hidden{display:none}.loading b{display:block;color:#f4bd2f;font-size:22px;margin-bottom:8px}.loading span{line-height:1.45;color:#dce9f1}@media(max-width:620px){.boostShellNav{height:68px;padding:8px}.boostFrame{top:68px;height:calc(100% - 68px)}.loading{inset:68px 0 0}.boostShellTitle span{display:none}.boostSaveState{display:none}.boostReturn{padding:9px 11px;font-size:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.BOOST_CONFIG={cloudEnabled:true,supabaseUrl:'https://dxcajwarqojvmbteroco.supabase.co',supabaseAnonKey:'sb_publishable_ehUKOOksq5SlkTNb-wQ8ZA_Zh8XlWDF',region:'Pinal County'};</script>
<script src="https://pinalworkforce1-del.github.io/BOOST_Pathway-Portal/assets/js/boost-cloud.js?v=20260916aishell1"></script>
</head>
<body>
<header class="boostShellNav"><div class="boostShellTitle"><b>AI & You • Pinal BOOST</b><span>Your work is saved before you return to the BOOST map.</span></div><div class="boostSaveState" id="saveState">Ready</div><button class="boostReturn" id="saveReturn" type="button">← Save &amp; Return to BOOST</button></header>
<iframe class="boostFrame" id="aiFrame" title="BOOST — AI & You"></iframe>
<div class="loading" id="loading"><div><b>Loading AI & You…</b><span>Connecting the activity to your Pinal BOOST journey.</span></div></div>
<script>
(()=>{'use strict';
const JK='pinal_boost_journey_v1',frame=document.getElementById('aiFrame'),btn=document.getElementById('saveReturn'),saveState=document.getElementById('saveState'),loading=document.getElementById('loading');
function readJourney(){try{return JSON.parse(localStorage.getItem(JK)||'{}')||{}}catch{return{}}}
function returnUrl(){const q=new URLSearchParams(location.search),raw=q.get('boost_return');if(raw){try{const u=new URL(raw,location.href);if(u.origin===location.origin)return u}catch(_){}}return new URL('https://pinalworkforce1-del.github.io/BOOST_Pathway-Portal/',location.href)}
function frameState(){const w=frame.contentWindow,d=frame.contentDocument;let s={sector:null,promptHits:[false,false,false,false,false],sampleJudgment:null,challenge:{1:null,2:null,3:null},learn:null};try{s=w.eval('JSON.parse(JSON.stringify(st))')}catch(_){}const selected={};for(let r=1;r<=3;r++){const root=d?.getElementById('r'+r),wrong=root?.querySelector('.letterAns.wrong'),correct=root?.querySelector('.letterAns.correct');selected[r]=(wrong||correct)?.textContent?.trim()||null}const learnBtns=[...(d?.querySelectorAll('#learn .ans')||[])];let learnSelectedIndex=null;learnBtns.forEach((x,i)=>{if(x.style.outline)learnSelectedIndex=i});return{state:s,prompt:d?.getElementById('prompt')?.value||'',reflection:d?.getElementById('reflection')?.value||'',challengeSelected:selected,learnSelectedIndex,activeRound:d?.querySelector('.challengeRound.active')?.id||'round1',savedAt:new Date().toISOString()}}
async function persistCheckpoint(){const j=readJourney(),now=new Date().toISOString(),existing=j.modules?.ai||null;j.schema_version=j.schema_version||2;j.region='Pinal County';j.modules=j.modules||{};j.modules.ai_checkpoint={version:'ai-you-v2-checkpoint-20260924',status:existing?.completed_at?'complete':'in_progress',...frameState(),career_context:(()=>{try{return frame.contentWindow.getCareer?.()||null}catch{return null}})()};j.updated_at=now;j.updatedAt=now;localStorage.setItem(JK,JSON.stringify(j));let cloud=false;try{cloud=!!(await window.PinalBOOSTCloud?.saveNow?.())}catch(e){console.warn('Pinal AI checkpoint cloud save unavailable',e)}return cloud}
function restoreCheckpoint(){const mods=readJourney()?.modules||{},cp=mods.ai_checkpoint||mods.module5_checkpoint;if(!cp||cp.status==='complete')return;const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;try{if(cp.state)w.eval('st = '+JSON.stringify(cp.state))}catch(e){console.warn('AI checkpoint state restore unavailable',e)}const s=cp.state||{};if(s.sector){const sector=d.querySelector('[data-sector="'+s.sector+'"]');try{if(sector)w.pick(s.sector,sector)}catch(_){}try{w.eval('st = '+JSON.stringify(s))}catch(_){}if(d.getElementById('prompt'))d.getElementById('prompt').value=cp.prompt||'';if((s.promptHits||[]).some(Boolean)&&cp.prompt){try{w.scorePrompt()}catch(_){}}if(s.sampleJudgment){const x=[...(d.querySelectorAll('#aiBox .ans')||[])].find(b=>(b.getAttribute('onclick')||'').includes("'"+s.sampleJudgment+"'"));try{if(x)w.judge(x,s.sampleJudgment)}catch(_){}}}
 if(Number.isInteger(cp.learnSelectedIndex)){const lb=[...(d.querySelectorAll('#learn .ans')||[])][cp.learnSelectedIndex];try{if(lb)w.quiz(lb,!!s.learn)}catch(_){}}
 for(let r=1;r<=3;r++){const letter=cp.challengeSelected?.[r];if(!letter)continue;const rb=[...(d.querySelectorAll('#r'+r+' .letterAns')||[])].find(b=>b.textContent.trim()===letter);try{if(rb)w.challengeAnswer(r,letter,rb)}catch(_){}}
 const round=Number(String(cp.activeRound||'round1').replace(/\D/g,''))||1;if(round>1){try{w.nextChallenge(round)}catch(_){}}
 const reflection=d.getElementById('reflection');if(reflection)reflection.value=cp.reflection||'';saveState.textContent='Progress restored'}
async function saveAndReturn(completed=false){btn.disabled=true;btn.textContent=completed?'Saving completion…':'Saving progress…';saveState.textContent='Saving…';const cloud=await persistCheckpoint();saveState.textContent=cloud?'Saved':'Saved on device';const target=returnUrl();if(completed){const q=new URLSearchParams(location.search),nonce=q.get('boost_nonce');if(nonce){target.searchParams.set('boost_complete','ai');target.searchParams.set('boost_nonce',nonce)}}setTimeout(()=>location.assign(target.toString()),220)}
function overrideCompletion(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;w.boostOfferCompletion=function(moduleId,mount){const q=new URLSearchParams(location.search),requested=q.get('boost_module'),nonce=q.get('boost_nonce');if(requested!==moduleId||!nonce||!mount)return;let box=d.getElementById('boostCompletionReturn');if(!box){box=d.createElement('div');box.id='boostCompletionReturn';box.style.cssText='margin:20px 0;padding:20px;border:3px solid #16835b;border-radius:16px;background:#effff7;text-align:center';mount.appendChild(box)}box.innerHTML='<h3 style="margin:0 0 8px">Activity Complete</h3><p style="margin:0 0 14px">Your completed AI & You evidence has been saved. Return to BOOST to unlock your next step.</p><button type="button" id="boostSaveReturn" style="padding:13px 20px;border:0;border-radius:10px;background:#0d6248;color:#fff;font-weight:900;cursor:pointer">Save Completion & Return to BOOST</button>';d.getElementById('boostSaveReturn').onclick=()=>saveAndReturn(true)}}
function buildFrameUrl(){const u=new URL('ai-you-v2.html',location.href),q=new URLSearchParams(location.search);q.forEach((v,k)=>u.searchParams.set(k,v));return u.toString()}
btn.addEventListener('click',()=>saveAndReturn(false));frame.addEventListener('load',()=>{try{overrideCompletion();restoreCheckpoint();loading.classList.add('hidden')}catch(e){console.warn('AI shell setup incomplete',e);loading.classList.add('hidden')}});frame.src=buildFrameUrl();
})();
</script>
</body>
</html>
